    <text x="886" y="674" class="font tile-small muted">Flight Data</text>

    <rect x="1040" y="625" width="195" height="65" rx="9" class="future" aria-label="Sabre／航司 NDC（未來）"/>
    <use href="#i-plane" x="1055" y="635" width="42" height="42"/>
    <text x="1111" y="651" class="font tile-title ink">Sabre</text>
    <text x="1111" y="673" class="font tile-title ink">航司 NDC</text>
    <rect x="1185" y="632" width="38" height="20" rx="10" fill="#dfe8f9"/>
    <text x="1204" y="646" text-anchor="middle" class="font tile-small ink">未來</text>
  </g>

  <!-- Infrastructure -->
