    <rect x="815" y="468" width="195" height="76" rx="9" class="tile"/>
    <use href="#i-mail" x="830" y="482" width="44" height="44"/>
    <text x="890" y="500" class="font tile-title ink">通知與文件服務</text>
    <text x="890" y="521" class="font tile-small muted">Notification &amp; Document</text>

    <rect x="1040" y="468" width="195" height="76" rx="9" class="tile"/>
    <use href="#i-workflow" x="1055" y="482" width="44" height="44"/>
    <text x="1115" y="500" class="font tile-title ink">整合 API</text>
    <text x="1115" y="521" class="font tile-small muted">API Integration</text>
  </g>

  <!-- Data layer -->
  <rect x="340" y="580" width="920" height="130" rx="12" class="section"/>
  <text x="800" y="610" text-anchor="middle" class="font section-title ink">資料層</text>

  <g>
