    </symbol>
    <symbol id="i-database" viewBox="0 0 48 48">
      <ellipse class="icon" cx="24" cy="10" rx="16" ry="6"/>
      <path class="icon" d="M8 10v10c0 3 7 6 16 6s16-3 16-6V10M8 20v10c0 3 7 6 16 6s16-3 16-6V20M8 30v8c0 3 7 6 16 6s16-3 16-6v-8"/>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 48 48">
      <path class="icon" d="M13 38h24a8 8 0 0 0 1-16 14 14 0 0 0-27-3A10 10 0 0 0 13 38z"/>
    </symbol>
    <symbol id="i-building" viewBox="0 0 48 48">
      <path class="icon" d="M8 42V12l16-7 16 7v30M4 42h40M15 17h4M24 17h4M15 25h4M24 25h4M15 33h4M24 33h4M33 17h3M33 25h3M33 33h3"/>
    </symbol>
    <symbol id="i-network" viewBox="0 0 48 48">
      <circle class="icon" cx="24" cy="10" r="5"/>
      <circle class="icon" cx="10" cy="37" r="5"/>
      <circle class="icon" cx="38" cy="37" r="5"/>
      <path class="icon" d="M22 15L12 32M26 15l10 17M15 37h18"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 48 48">
      <rect class="icon" x="7" y="7" width="13" height="13" rx="2"/>
      <rect class="icon" x="28" y="7" width="13" height="13" rx="2"/>
      <rect class="icon" x="7" y="28" width="13" height="13" rx="2"/>
      <rect class="icon" x="28" y="28" width="13" height="13" rx="2"/>
    </symbol>
