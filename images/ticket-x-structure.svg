  <rect x="510" y="32" width="580" height="42" rx="21" fill="#173f8c"/>
  <text x="800" y="60" text-anchor="middle" class="font title" fill="#ffffff">機加X 智慧旅遊組合平台</text>

  <!-- Application scenarios -->
  <rect x="340" y="88" width="920" height="222" rx="12" class="section"/>
  <text x="800" y="118" text-anchor="middle" class="font section-title ink">應用情境</text>

  <g>
    <rect x="357" y="137" width="135" height="140" rx="9" class="tile"/>
    <use href="#i-box" x="402" y="150" width="45" height="45"/>
    <text x="424.5" y="218" text-anchor="middle" class="font tile-title ink">商品上架</text>
    <text x="424.5" y="239" text-anchor="middle" class="font tile-small muted">Product Setup</text>

    <line x1="495" y1="207" x2="503" y2="207" stroke="#6e8fd6" stroke-width="1.6" marker-end="url(#flow-end)"/>

    <rect x="507" y="137" width="135" height="140" rx="9" class="tile"/>
    <use href="#i-price" x="552" y="150" width="45" height="45"/>
    <text x="574.5" y="214" text-anchor="middle" class="font tile-title ink">組合變價引擎</text>
    <text x="574.5" y="236" text-anchor="middle" class="font tile-small muted">Dynamic Pricing</text>

    <line x1="645" y1="207" x2="653" y2="207" stroke="#6e8fd6" stroke-width="1.6" marker-end="url(#flow-end)"/>

    <rect x="657" y="137" width="135" height="140" rx="9" class="tile" aria-label="前台搜尋／訂購"/>
    <use href="#i-search" x="702" y="150" width="45" height="45"/>
    <text x="724.5" y="211" text-anchor="middle" class="font tile-title ink">
      <tspan x="724.5" dy="0">前台搜尋</tspan><tspan x="724.5" dy="19">／訂購</tspan>
    </text>
    <text x="724.5" y="254" text-anchor="middle" class="font tile-small muted">Search &amp; Booking</text>

    <line x1="795" y1="207" x2="803" y2="207" stroke="#6e8fd6" stroke-width="1.6" marker-end="url(#flow-end)"/>

    <rect x="807" y="137" width="135" height="140" rx="9" class="tile"/>
    <use href="#i-payment" x="852" y="150" width="45" height="45"/>
    <text x="874.5" y="218" text-anchor="middle" class="font tile-title ink">付款</text>
    <text x="874.5" y="239" text-anchor="middle" class="font tile-small muted">Payment</text>

    <line x1="945" y1="207" x2="953" y2="207" stroke="#6e8fd6" stroke-width="1.6" marker-end="url(#flow-end)"/>

    <rect x="957" y="137" width="135" height="140" rx="9" class="tile" aria-label="機票開票／行程確認"/>
    <use href="#i-ticket" x="1002" y="147" width="45" height="45"/>
    <text x="1024.5" y="208" text-anchor="middle" class="font tile-title ink">
      <tspan x="1024.5" dy="0">機票開票／</tspan><tspan x="1024.5" dy="19">行程確認</tspan>
    </text>
    <text x="1024.5" y="253" text-anchor="middle" class="font tile-small muted">Ticketing</text>

    <line x1="1095" y1="207" x2="1103" y2="207" stroke="#6e8fd6" stroke-width="1.6" marker-end="url(#flow-end)"/>

    <rect x="1107" y="137" width="135" height="140" rx="9" class="tile"/>
    <use href="#i-mail" x="1152" y="147" width="45" height="45"/>
    <text x="1174.5" y="208" text-anchor="middle" class="font tile-title ink">
      <tspan x="1174.5" dy="0">行程確認單</tspan><tspan x="1174.5" dy="19">寄送</tspan>
    </text>
    <text x="1174.5" y="253" text-anchor="middle" class="font tile-small muted">Delivery</text>
  </g>

