      <path class="icon" d="M8 16h32M12 13h1M16 13h1M20 13h1M5 38h38M13 33l-3 5M35 33l3 5"/>
    </symbol>
    <symbol id="i-desktop" viewBox="0 0 48 48">
      <rect class="icon" x="7" y="8" width="34" height="25" rx="3"/>
      <path class="icon" d="M18 40h12M24 33v7M13 14h22M13 19h15"/>
    </symbol>
    <symbol id="i-api" viewBox="0 0 48 48">
      <path class="icon" d="M18 11L7 24l11 13M30 11l11 13-11 13M27 7L21 41"/>
    </symbol>
    <symbol id="i-mobile" viewBox="0 0 48 48">
      <rect class="icon" x="14" y="5" width="20" height="38" rx="5"/>
      <path class="icon" d="M21 9h6M22 38h4"/>
