    <symbol id="i-ticket" viewBox="0 0 48 48">
      <path class="icon" d="M7 14h34v8a5 5 0 0 0 0 10v8H7v-8a5 5 0 0 0 0-10v-8zM18 16v22"/>
      <path class="icon" d="M26 22h8M26 28h8M26 34h5"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 48 48">
      <rect class="icon" x="5" y="10" width="38" height="28" rx="4"/>
      <path class="icon" d="M6 13l18 14 18-14M7 36l13-12M41 36L28 24"/>
    </symbol>
    <symbol id="i-rules" viewBox="0 0 48 48">
      <rect class="icon" x="9" y="6" width="30" height="36" rx="3"/>
      <path class="icon" d="M16 15h16M16 23h10M16 31h13M31 27l3 3 6-7"/>
    </symbol>
    <symbol id="i-compose" viewBox="0 0 48 48">
      <rect class="icon" x="5" y="7" width="15" height="15" rx="2"/>
      <rect class="icon" x="28" y="7" width="15" height="15" rx="2"/>
      <rect class="icon" x="16" y="29" width="16" height="14" rx="2"/>
      <path class="icon" d="M13 22v4h22v-4M24 26v3"/>
    </symbol>
    <symbol id="i-gauge" viewBox="0 0 48 48">
      <path class="icon" d="M8 34a16 16 0 1 1 32 0M24 34l9-11"/>
      <circle cx="24" cy="34" r="2.5" fill="#1f52ac"/>
      <path class="icon" d="M12 34h24"/>
    </symbol>
    <symbol id="i-order" viewBox="0 0 48 48">
      <path class="icon" d="M7 9h6l4 22h21l4-15H16M20 37a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM34 37a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
    </symbol>
    <symbol id="i-plane" viewBox="0 0 48 48">
      <path class="icon" d="M43 25L27 21 24 7l-5-2-2 14-8-2-3-5-3 1 2 8 14 6-6 12 4 2 10-11 10 4c4 1 7-1 6-3z"/>
    </symbol>
    <symbol id="i-workflow" viewBox="0 0 48 48">
      <circle class="icon" cx="10" cy="11" r="5"/>
      <circle class="icon" cx="38" cy="11" r="5"/>
      <circle class="icon" cx="24" cy="38" r="5"/>
      <path class="icon" d="M15 11h18M12 16l9 17M36 16L27 33"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 48 48">
      <path class="icon" d="M5 12h15l5 6h18v22H5V12z"/>
