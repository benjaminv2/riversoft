  <text x="435" y="805" class="font tile-small muted">Scalable · Resilient · Multi-Cloud</text>

  <rect x="780" y="759" width="130" height="48" rx="24" class="tile"/>
  <text x="845" y="789" text-anchor="middle" class="font tile-title ink">AWS</text>
  <rect x="930" y="759" width="130" height="48" rx="24" class="tile"/>
  <text x="995" y="789" text-anchor="middle" class="font tile-title ink">GCP</text>
  <rect x="1080" y="759" width="150" height="48" rx="24" class="tile"/>
  <text x="1155" y="789" text-anchor="middle" class="font tile-title ink">Azure</text>

  <!-- Right connector -->
  <use href="#i-lock" x="1304" y="392" width="32" height="32"/>
  <line x1="1285" y1="450" x2="1355" y2="450" stroke="#2f63c7" stroke-width="2.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
