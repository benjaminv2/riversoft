<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">機加X 智慧旅遊組合平台架構圖</title>
  <desc id="diagram-desc">左側為使用者存取，中央為分成應用情境、核心模組、資料層與基礎建設的機加X平台，右側為整合系統。</desc>

  <defs>
    <style>
      .font { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif; }
      .ink { fill: #123b82; }
      .muted { fill: #61739a; }
      .title { font-size: 26px; font-weight: 700; }
      .side-title { font-size: 17px; font-weight: 700; }
      .section-title { font-size: 17px; font-weight: 700; }
      .tile-title { font-size: 15px; font-weight: 700; }
      .tile-small { font-size: 11px; font-weight: 400; }
      .side-label { font-size: 14px; font-weight: 600; }
      .connector { font-size: 12px; font-weight: 700; letter-spacing: .2px; }
      .icon { fill: none; stroke: #1f52ac; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .tile { fill: #ffffff; stroke: #86a7e7; stroke-width: 1.4; }
      .tile-soft { fill: #f7faff; stroke: #86a7e7; stroke-width: 1.4; }
      .section { fill: #f4f7fd; stroke: #2f63c7; stroke-width: 1.5; }
      .future { fill: #fafcff; stroke: #7e98c9; stroke-width: 1.4; stroke-dasharray: 5 4; }
    </style>

    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10 0 L0 5 L10 10 Z" fill="#2f63c7"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f63c7"/>
    </marker>
    <marker id="flow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6e8fd6"/>
    </marker>

    <symbol id="i-lock" viewBox="0 0 32 32">
      <rect class="icon" x="7" y="14" width="18" height="14" rx="3"/>
      <path class="icon" d="M11 14V10a5 5 0 0 1 10 0v4"/>
      <circle cx="16" cy="21" r="1.7" fill="#1f52ac"/>
    </symbol>
    <symbol id="i-browser" viewBox="0 0 48 48">
