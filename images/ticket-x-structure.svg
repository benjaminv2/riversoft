  <!-- Footer note -->
  <g transform="translate(430 865)">
    <path d="M0 0l12-5 12 5v10c0 8-5 14-12 18C5 24 0 18 0 10V0z" fill="none" stroke="#2f63c7" stroke-width="1.5" transform="scale(.65)"/>
    <text x="25" y="11" class="font tile-small muted">Cloud Native 架構支援彈性擴展、多雲部署與企業系統安全整合</text>
  </g>
