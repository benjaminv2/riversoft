  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Left access column -->
  <rect x="35" y="75" width="200" height="780" rx="14" fill="#f6f9ff" stroke="#b7c9eb" stroke-width="1.5"/>
  <rect x="48" y="45" width="174" height="38" rx="19" fill="#173f8c"/>
  <text x="135" y="70" text-anchor="middle" class="font side-title" fill="#ffffff">使用者存取</text>

  <use href="#i-browser" x="104" y="132" width="62" height="62"/>
  <text x="135" y="215" text-anchor="middle" class="font side-label ink">Web Browser</text>
  <use href="#i-desktop" x="104" y="292" width="62" height="62"/>
  <text x="135" y="375" text-anchor="middle" class="font side-label ink">Desktop</text>
  <use href="#i-api" x="104" y="452" width="62" height="62"/>
  <text x="135" y="535" text-anchor="middle" class="font side-label ink">API Client</text>
  <use href="#i-mobile" x="104" y="612" width="62" height="62"/>
  <text x="135" y="695" text-anchor="middle" class="font side-label ink">Mobile App</text>

  <!-- Left connector -->
  <use href="#i-lock" x="264" y="392" width="32" height="32"/>
  <line x1="245" y1="450" x2="315" y2="450" stroke="#2f63c7" stroke-width="2.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="280" y="478" text-anchor="middle" class="font connector ink">HTTPS/TLS</text>

  <!-- Center platform boundary and title -->
