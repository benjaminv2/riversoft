    <rect x="735" y="632" width="38" height="20" rx="10" fill="#dfe8f9"/>
    <text x="754" y="646" text-anchor="middle" class="font tile-small ink">未來</text>
    <text x="661" y="674" class="font tile-small muted">Hotel &amp; Activities</text>

    <rect x="815" y="625" width="195" height="65" rx="9" class="tile"/>
    <use href="#i-plane" x="830" y="635" width="42" height="42"/>
